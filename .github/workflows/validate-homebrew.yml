name: Validate Homebrew Installation

on:
  pull_request:
    types: [closed]

jobs:
  validate-homebrew:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.title, 'Update Homebrew formula') ||
      startsWith(github.event.pull_request.title, 'Update Homebrew distribution'))
    
    permissions:
      contents: read
      issues: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS ARM64
          - os: ubuntu-latest
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux ARM64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Select Homebrew package type
        id: package
        run: |
          if [[ "${{ runner.os }}" == "macOS" && -f Casks/modernize.rb ]]; then
            package_type=cask
            definition=Casks/modernize.rb
            verify_runtime=true
          else
            package_type=formula
            definition=Formula/modernize.rb
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              verify_runtime=false
              echo "Using legacy macOS Formula validation because no Cask definition exists."
            else
              verify_runtime=true
            fi
          fi

          {
            echo "type=$package_type"
            echo "definition=$definition"
            echo "verify_runtime=$verify_runtime"
          } >> "$GITHUB_OUTPUT"

      - name: Tap and install modernize
        run: |
          brew tap ${{ github.repository }} https://github.com/${{ github.repository }}
          brew trust ${{ github.repository }}
          brew install --${{ steps.package.outputs.type }} modernize

      - name: Extract expected version
        id: version
        run: |
          version=$(grep '^  version ' "${{ steps.package.outputs.definition }}" | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Expected version: $version"

      - name: Verify installation
        id: verify
        run: |
          output=$(modernize --version)
          echo "Version output: $output"
          if echo "$output" | grep -q "${{ steps.version.outputs.version }}"; then
            echo "Version verified successfully"
          else
            echo "::error::Version mismatch. Expected '${{ steps.version.outputs.version }}' in output but got: $output"
            exit 1
          fi

      - name: Verify bundled Copilot runtime
        if: steps.package.outputs.verify_runtime == 'true'
        run: |
          if [[ "${{ steps.package.outputs.type }}" == "cask" ]]; then
            runtime_root="$(brew --caskroom modernize)"
          else
            runtime_root="$(brew --prefix modernize)/libexec"
          fi

          runtime=$(find "$runtime_root" -path '*/native/copilot' -type f | head -1)
          runtime_node=$(find "$runtime_root" -path '*/native/runtime.node' -type f | head -1)
          test -n "$runtime"
          test -n "$runtime_node"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign --verify --strict --verbose=4 "$runtime"
            codesign --verify --strict --verbose=4 "$runtime_node"

            runtime_team=$(codesign -dv --verbose=4 "$runtime" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            node_team=$(codesign -dv --verbose=4 "$runtime_node" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            test -n "$runtime_team"
            test "$runtime_team" = "$node_team"
          fi

          runtime_stderr=$(mktemp)
          "$runtime" --headless --no-auto-update --stdio </dev/null >/dev/null 2>"$runtime_stderr"
          if grep -Eqi 'failed to load runtime|dlopen failed|Library Validation failed' "$runtime_stderr"; then
            cat "$runtime_stderr" >&2
            exit 1
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Homebrew validation failed on ${{ matrix.name }}`,
              body: `Homebrew installation validation failed for **${{ matrix.name }}**.\n\n**PR:** #${{ github.event.pull_request.number }}\n**Expected version:** ${{ steps.version.outputs.version }}\n**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate the failure.`,
              labels: ['homebrew', 'validation-failure'],
              assignees: ['galiacheng']
            });
